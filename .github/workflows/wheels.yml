name: Wheels
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Run a pre-release, testing the build"
        required: false
        type: boolean
        default: false

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-14"
          - "windows-latest"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: pypa/cibuildwheel@v4.1.0
      # upload/download-artifact stay on v4: v5 still declares node20,
      # so bumping gains nothing for the Node 24 migration.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build twine
      - name: Build sdist
        run: python -m build --sdist .
      - name: Check the sdist
        run: python -m twine check dist/*.tar.gz
      # On a tag push, fail fast if the version setuptools_scm derived does not
      # match the tag. Without this the release is silent-but-wrong: two tags
      # on one commit (e.g. v0.4.0 alongside v0.4.0rc2) make `git describe`
      # pick one non-deterministically, so a v0.4.0 run built and would have
      # published rc2-named artifacts. It only failed because those files
      # already existed on PyPI.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/exoplanet_core-(.*)\.tar\.gz|\1|')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag' but the" \
                 "build produced '$built'. Refusing to publish. If two tags" \
                 "point at this commit, move the release tag to its own commit."
            exit 1
          fi
      # upload/download-artifact stay on v4: v5 still declares node20,
      # so bumping gains nothing for the Node 24 migration.
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    environment:
      name: pypi
      url: https://pypi.org/p/exoplanet-core
    permissions:
      id-token: write
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      # upload/download-artifact stay on v4: v5 still declares node20,
      # so bumping gains nothing for the Node 24 migration.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.12.3

  # Pushing a tag publishes to PyPI but does NOT create a GitHub Release --
  # that is a separate object -- so the Releases page silently fell years
  # behind the tags (it still showed v0.3.1 while v0.4.0 was on PyPI). Create
  # it here from the annotated tag's own message, so the two never diverge
  # again. Tags containing a/b/rc are marked as pre-releases.
  github_release:
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Body = the annotated tag message minus its first line (the title).
          git tag -l "$tag" --format='%(contents)' | tail -n +2 > notes.md
          prerelease=""
          case "$tag" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file notes.md $prerelease dist/*
